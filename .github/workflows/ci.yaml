name: CI

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --config=.golangci.yml

  vet:
      name: Vet
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Setup Go
          uses: actions/setup-go@v7
          with:
            go-version-file: go.mod
      
        - name: Install Dependencies
          run: go mod download

        - name: Run vet
          run: go vet ./... 

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
    
      - name: Install Dependencies
        run: go mod download

      - name: Run tests
        run: go test -race ./...
